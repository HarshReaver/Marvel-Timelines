eries","datePublished":"1992","description":"The classic cartoon with Wolverine, Storm, Rogue, Gambit and Jubilee. It adapted Days of Future Past and the Dark Phoenix Saga years before the films did. Xavier's yellow hover-chair and the theme tune both resurface in the MCU.","url":"https://marvel.harver.in/xmen.html#t=xmtas","image":"https://upload.wikimedia.org/wikipedia/en/e/ed/X-Men_The_Animated_Series_logo.jpg","numberOfSeasons":5,"numberOfEpisodes":76,"sameAs":"https://en.wikipedia.org/wiki/X-Men%3A_The_Animated_Series"}},{"@type":"ListItem","position":2,"item":{"@type":"Movie","name":"Generation X","datePublished":"1996","description":"Teen mutants Jubilee and Skin train at Emma Frost and Banshee's school and fight a mad scientist who enters dreams. A failed TV pilot.","url":"https://marvel.harver.in/xmen.html#t=genx","image":"https://upload.wikimedia.org/wikipedia/en/a/a7/GenerationX-poster.jpg","sameAs":"https://en.wikipedia.org/wiki/Generation_X_(film)"}},{"@type":"ListItem","position":3,"item":{"@type":"Movie","name":"X-Men","datePublished":"2000","description":"Rogue runs away after her powers put a boy in a coma. She and Logan are brought to Xavier's school. Magneto kidnaps Rogue to power a machine that would mutate world leaders at a summit on Ellis Island. The X-Men stop him, Senator Kelly dies, and Magneto ends up in a plastic prison.","url":"https://marvel.harver.in/xmen.html#t=xm1","image":"https://upload.wikimedia.org/wikipedia/en/8/81/X-MenfilmPoster.jpg","sameAs":"https://en.wikipedia.org/wiki/X-Men_(film)"}},{"@type":"ListItem","position":4,"item":{"@type":"Movie","name":"X2","datePublished":"2003","description":"Colonel William Stryker raids the school and uses a brainwashed Xavier and a copy of Cerebro to try to kill every mutant. The X-Men team up with Magneto, Nightcrawler is introduced, and Logan learns he was experimented on at Alkali Lake. Jean sacrifices herself to save the team as the dam floods.","url":"https://marvel.harver.in/xmen.html#t=xm2","image":"https://upload.wikimedia.org/wikipedia/en/3/3e/X2_poster.jpg","sameAs":"https://en.wikipedia.org/wiki/X2_(film)"}},{"@type":"ListItem","position":5,"item":{"@type":"Movie","name":"X-Men: The Last Stand","datePublished":"2006","description":"Jean comes back as the Phoenix, kills Cyclops and later Xavier, and joins Magneto. A \"cure\" for mutation splits mutantkind. Magneto attacks Alcatraz, Logan is forced to kill Jean, and Magneto loses his powers. Kelsey Grammer plays Beast, a role he repeats in The Marvels.","url":"https://marvel.harver.in/xmen.html#t=xm3","image":"https://upload.wikimedia.org/wikipedia/en/1/13/X-Men_The_Last_Stand_2006_theatrical_poster.jpg","sameAs":"https://en.wikipedia.org/wiki/X-Men%3A_The_Last_Stand"}},{"@type":"ListItem","position":6,"item":{"@type":"TVSeries","name":"Wolverine and the X-Men","datePublished":"2009","description":"An animated series. Xavier and Jean vanish, Logan leads a reformed team, and a future Xavier warns that a Sentinel apocalypse is coming. It was cancelled after one season.","url":"https://marvel.harver.in/xmen.html#t=wxm","image":"https://upload.wikimedia.org/wikipedia/en/7/72/Wolverineandthexmenanimated.jpg","numberOfSeasons":1,"numberOfEpisodes":26,"sameAs":"https://en.wikipedia.org/wiki/Wolverine_and_the_X-Men_(TV_series)"}},{"@type":"ListItem","position":7,"item":{"@type":"Movie","name":"X-Men Origins: Wolverine","datePublished":"2009","description":"Logan and his brother Victor fight through every American war from 1845 on, then join Stryker's Team X. Logan quits, is betrayed, gets an adamantium skeleton, and has his memories wiped by an adamantium bullet. Ryan Reynolds plays a mouth-sewn version of Deadpool.","url":"https://marvel.harver.in/xmen.html#t=origins","image":"https://upload.wikimedia.org/wikipedia/en/0/08/X-Men_Origins_Wolverine_theatrical_poster.jpg","sameAs":"https://en.wikipedia.org/wiki/X-Men_Origins%3A_Wolverine"}},{"@type":"ListItem","position":8,"item":{"@type":"Movie","name":"X-Men: First Class","datePublished":"2011","description":"In 1962, young Charles Xavier and Erik Lehnsherr recruit mutants to stop Sebastian Shaw, the Nazi who killed Erik's mother, from starting a nuclear war during the Cuban Missile Crisis. Erik kills Shaw, and a deflected bullet paralyses Charles. Erik becomes Magneto, and Raven leaves with him as Mystique.","url":"https://marvel.harver.in/xmen.html#t=fc","image":"https://upload.wikimedia.org/wikipedia/en/5/55/X-MenFirstClassMoviePoster.jpg","sameAs":"https://en.wikipedia.org/wiki/X-Men%3A_First_Class"}},{"@type":"ListItem","position":9,"item":{"@type":"Movie","name":"The Wolverine","datePublished":"2013","description":"A guilt-ridden Logan, haunted by Jean, goes to Japan to say goodbye to a man he saved at Nagasaki. He loses his healing factor for a while and fights the Silver Samurai. Two years later, Xavier and Magneto warn him of a new threat.","url":"https://marvel.harver.in/xmen.html#t=tw","image":"https://upload.wikimedia.org/wikipedia/en/7/74/The_Wolverine_posterUS.jpg","sameAs":"https://en.wikipedia.org/wiki/The_Wolverine_(film)"}},{"@type":"ListItem","position":10,"item":{"@type":"Movie","name":"X-Men: Days of Future Past","datePublished":"2014","description":"In 2023, Sentinels built from Mystique's shape-shifting DNA have nearly wiped out mutants. Kitty sends Logan's mind back to 1973 to stop Mystique from assassinating Bolivar Trask. Young Charles and Erik help, and Raven spares Trask at the White House. History rewrites itself, and Logan wakes up in a peaceful 2023 with Jean and Scott alive.","url":"https://marvel.harver.in/xmen.html#t=dofp","image":"https://upload.wikimedia.org/wikipedia/en/0/0c/X-Men_Days_of_Future_Past_poster.jpg","sameAs":"https://en.wikipedia.org/wiki/X-Men%3A_Days_of_Future_Past"}},{"@type":"ListItem","position":11,"item":{"@type":"Movie","name":"Deadpool","datePublished":"2016","description":"Wade Wilson, dying of cancer, is tortured into a disfigured, unkillable mercenary by Ajax. With Colossus and Negasonic Teenage Warhead, he rescues his girlfriend Vanessa. Fourth-wall jokes and an R rating made it a huge hit.","url":"https://marvel.harver.in/xmen.html#t=dp1","image":"https://upload.wikimedia.org/wikipedia/en/2/23/Deadpool_%282016_poster%29.png","sameAs":"https://en.wikipedia.org/wiki/Deadpool_(film)"}},{"@type":"ListItem","position":12,"item":{"@type":"Movie","name":"X-Men: Apocalypse","datePublished":"2016","description":"En Sabah Nur, the first mutant, wakes up in 1983 and recruits Magneto, Storm, Psylocke and Angel. Young Jean, Scott and Nightcrawler join the school, and Jean's Phoenix power destroys Apocalypse.","url":"https://marvel.harver.in/xmen.html#t=apoc","image":"https://upload.wikimedia.org/wikipedia/en/0/04/X-Men_-_Apocalypse.jpg","sameAs":"https://en.wikipedia.org/wiki/X-Men%3A_Apocalypse"}},{"@type":"ListItem","position":13,"item":{"@type":"Movie","name":"Logan","datePublished":"2017","description":"In 2029 almost no mutants are left. An ageing Logan, his healing failing, cares for a senile Xavier. He protects Laura (X-23), a girl cloned from his DNA, from Transigen. Xavier is killed by a Wolverine clone, and Logan dies saving the children. Deadpool & Wolverine later calls him the anchor being of his universe.","url":"https://marvel.harver.in/xmen.html#t=logan","image":"https://upload.wikimedia.org/wikipedia/en/3/37/Logan_2017_poster.jpg","sameAs":"https://en.wikipedia.org/wiki/Logan_(film)"}},{"@type":"ListItem","position":14,"item":{"@type":"TVSeries","name":"Legion","datePublished":"2017","description":"David Haller, a powerful mutant diagnosed with schizophrenia, finds that a parasitic mind, the Shadow King, has lived in his head since childhood. He turns out to be Xavier's son. A surreal three-season show, separate from the films.","url":"https://marvel.harver.in/xmen.html#t=legion","image":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Legion_TV_series_logo.jpg/500px-Legion_TV_series_logo.jpg","numberOfSeasons":3,"numberOfEpisodes":27,"sameAs":"https://en.wikipedia.org/wiki/Legion_(TV_series)"}},{"@type":"ListItem","position":15,"item":{"@type":"TVSeries","name":"The Gifted","datePublished":"2017","description":"A suburban family goes on the run after their kids' powers emerge, in a world where the X-Men have vanished. Two seasons, separate from the films.","url":"https://marvel.harver.in/xmen.html#t=gifted","image":"https://marvel.harver.in/assets/posters/gifted.jpg","numberOfSeasons":2,"numberOfEpisodes":29,"sameAs":"https://en.wikipedia.org/wiki/The_Gifted_(American_TV_series)"}},{"@type":"ListItem","position":16,"item":{"@type":"Movie","name":"Deadpool 2","datePublished":"2018","description":"Vanessa is killed, and Wade tries to protect a young mutant, Russell, from Cable, a soldier from the future. He forms X-Force, most of whom die in the first five minutes, and uses Cable's time device to fix everyone's deaths in the credits.","url":"https://marvel.harver.in/xmen.html#t=dp2","image":"https://upload.wikimedia.org/wikipedia/en/c/cf/Deadpool_2_poster.jpg","sameAs":"https://en.wikipedia.org/wiki/Deadpool_2"}},{"@type":"ListItem","position":17,"item":{"@type":"Movie","name":"Dark Phoenix","datePublished":"2019","description":"In 1992, Jean absorbs a cosmic force during a space rescue, loses control, and kills Mystique. Shape-shifting D'Bari aliens want the power. Jean sacrifices herself and becomes the Phoenix. It was the last Fox X-Men team film.","url":"https://marvel.harver.in/xmen.html#t=dph","image":"https://upload.wikimedia.org/wikipedia/en/9/9e/Dark_Phoenix_%28film%29.png","sameAs":"https://en.wikipedia.org/wiki/Dark_Phoenix_(film)"}},{"@type":"ListItem","position":18,"item":{"@type":"Movie","name":"The New Mutants","datePublished":"2020","description":"Five teen mutants are held in a hospital run by the Essex Corporation. Dani Moonstar's powers bring their worst fears to life, including the Demon Bear. Its links to the films are only loose.","url":
